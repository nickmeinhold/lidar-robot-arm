<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SO-101 Arm Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; overflow: hidden; font-family: 'SF Mono', 'Fira Code', monospace; }
  canvas { display: block; }

  /* --- HUD overlay --- */
  #hud {
    position: fixed; top: 16px; right: 16px;
    background: rgba(20, 20, 40, 0.85);
    border: 1px solid rgba(100, 120, 180, 0.3);
    border-radius: 8px; padding: 14px 18px;
    color: #c0c8e0; font-size: 12px; line-height: 1.7;
    min-width: 220px; backdrop-filter: blur(8px);
    z-index: 10;
  }
  #hud h3 { color: #8090c0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff4444; flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.connected { background: #44ff88; }
  .status-dot.viewing { background: #ffaa44; }
  .angle-row { display: flex; justify-content: space-between; }
  .angle-label { color: #7080a0; }
  .angle-value { color: #e0e8ff; font-variant-numeric: tabular-nums; }
  .tracking-badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 10px; margin-left: 4px;
  }
  .tracking-on { background: rgba(68, 255, 136, 0.2); color: #44ff88; }
  .tracking-off { background: rgba(255, 68, 68, 0.15); color: #ff6666; }
  #fps { color: #506080; font-size: 10px; margin-top: 6px; }

  /* --- Controls panel --- */
  #controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(20, 20, 40, 0.92);
    border-top: 1px solid rgba(100, 120, 180, 0.3);
    padding: 12px 20px; z-index: 10;
    backdrop-filter: blur(8px);
    transform: translateY(100%);
    transition: transform 0.3s ease;
  }
  #controls.open { transform: translateY(0); }
  #controls-toggle {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(40, 40, 70, 0.9); color: #8090c0;
    border: 1px solid rgba(100, 120, 180, 0.3); border-radius: 6px;
    padding: 6px 16px; cursor: pointer; font-family: inherit;
    font-size: 11px; z-index: 11;
    transition: bottom 0.3s ease;
  }
  #controls-toggle.open { bottom: 140px; }
  .slider-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px 20px; max-width: 800px; margin: 0 auto;
  }
  .slider-group { display: flex; flex-direction: column; gap: 2px; }
  .slider-group label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #7080a0;
  }
  .slider-group label span { color: #c0c8e0; }
  .slider-group input[type="range"] {
    width: 100%; accent-color: #4a90d9; height: 4px;
  }
  .btn-row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .btn {
    background: rgba(74, 144, 217, 0.2); color: #4a90d9;
    border: 1px solid rgba(74, 144, 217, 0.4); border-radius: 4px;
    padding: 4px 14px; cursor: pointer; font-family: inherit; font-size: 11px;
  }
  .btn:hover { background: rgba(74, 144, 217, 0.35); }

  /* Drive-real-arm arm/fire toggle — visually loud, default off */
  .btn-danger {
    background: rgba(255, 80, 80, 0.12); color: #ff8080;
    border-color: rgba(255, 80, 80, 0.4);
  }
  .btn-danger:hover { background: rgba(255, 80, 80, 0.22); }
  .btn-danger.driving {
    background: rgba(255, 60, 60, 0.9); color: #fff;
    border-color: #ff4444; font-weight: bold;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

  /* Whole-viewport warning ring while the real arm is live */
  body.driving-real::after {
    content: "⚡ LIVE — real arm is following";
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    border: 3px solid rgba(255, 60, 60, 0.85);
    color: #fff; background: transparent;
    font-size: 12px; text-align: center; padding-top: 6px;
    text-shadow: 0 0 4px #000;
  }
  .joint-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .jbtn {
    flex: 1 1 auto; min-width: 52px; padding: 6px 4px;
    background: #2a2f45; color: #c0c8e0;
    border: 1px solid #3a4160; border-radius: 5px; cursor: pointer;
    font-size: 11px; transition: background 0.12s, border-color 0.12s;
  }
  .jbtn:hover { background: #333a55; }
  .jbtn.selected {
    background: #2d5aa0; border-color: #4a90d9; color: #fff;
    box-shadow: 0 0 6px rgba(74,144,217,0.5);
  }
</style>
</head>
<body>

<div id="hud">
  <h3>SO-101 Arm</h3>
  <div class="status-row">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Connecting...</span>
  </div>
  <div id="tracking-row" style="margin-bottom: 8px; font-size: 11px;">
    Tracking:
    <span class="tracking-badge tracking-off" id="track-body">body</span>
    <span class="tracking-badge tracking-off" id="track-hand">hand</span>
  </div>
  <div id="angles-display"></div>
  <div id="fps"></div>
</div>

<button id="controls-toggle" onclick="toggleControls()">Test Controls</button>

<div id="controls">
  <div style="font-size:11px;color:#8890b0;margin-bottom:4px;">Select a joint, then drag the arc:</div>
  <div class="joint-row" id="joint-select">
    <button class="jbtn" data-joint="shoulder_yaw">Yaw</button>
    <button class="jbtn" data-joint="shoulder_pitch">Pitch</button>
    <button class="jbtn" data-joint="elbow_pitch">Elbow</button>
    <button class="jbtn" data-joint="wrist_pitch">W&#8209;Pitch</button>
    <button class="jbtn" data-joint="wrist_roll">W&#8209;Roll</button>
  </div>
  <div id="arc-status" style="font-size:11px;color:#9098b8;min-height:14px;margin-bottom:6px;"></div>
  <div class="slider-group" style="margin-bottom:8px;">
    <label>Gripper <span id="v-grip">100%</span></label>
    <input type="range" id="s-grip" min="0" max="1" step="0.01" value="1">
  </div>
  <div class="btn-row">
    <button class="btn" onclick="setHome()">Home (up)</button>
    <button class="btn" onclick="setForward()">Forward</button>
    <button class="btn" onclick="setRelaxed()">Relaxed</button>
    <button class="btn btn-danger" id="drive-btn" onclick="toggleDrive()">⚡ Drive Real Arm: OFF</button>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="setTorque(false)">Release (limp)</button>
    <button class="btn" onclick="setTorque(true)">Hold (rigid)</button>
    <button class="btn" onclick="captureZero()">Capture Zero</button>
    <span id="teach-status" style="color:#7080a0; font-size:11px; align-self:center;"></span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { collides as collidesJS, selfTest as collisionSelfTest } from './arm_collision.js';

// Drift guard: assert the JS collision port matches the tested Python fixtures.
collisionSelfTest();

// ─── SO-101 dimensions (meters) ──────────────────────────────────
const BASE_HEIGHT   = 0.048;
const BASE_RADIUS   = 0.035;
const UPPER_ARM_LEN = 0.1126;
const FOREARM_LEN   = 0.1349;
const WRIST_LEN     = 0.0601;
const LINK_RADIUS   = 0.012;
const JOINT_RADIUS  = 0.016;
const FINGER_W      = 0.008;
const FINGER_D      = 0.010;
const FINGER_H      = 0.040;
const GRIP_MAX_HALF = 0.0175;  // half of 35mm max opening

// ─── Colors ──────────────────────────────────────────────────────
const C = {
  base:    0x404060,
  joint:   0xff6b35,
  upper:   0x4a90d9,
  forearm: 0x5ba0e9,
  wrist:   0x6ab0f9,
  finger:  0x50c878,
  grid:    0x333355,
  ground:  0x222244,
};

// ─── Scene setup ─────────────────────────────────────────────────
const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.FogExp2(0x1a1a2e, 1.5);

const camera   = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 10);
camera.position.set(0.25, 0.25, 0.35);
camera.lookAt(0, 0.15, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.13, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.15;
controls.maxDistance = 1.5;
controls.update();

// ─── Lighting ────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x404060, 0.8);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(0.3, 0.5, 0.4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.1;
key.shadow.camera.far = 2;
key.shadow.camera.left = key.shadow.camera.bottom = -0.4;
key.shadow.camera.right = key.shadow.camera.top = 0.4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x6688cc, 0.4);
fill.position.set(-0.3, 0.3, -0.2);
scene.add(fill);

// ─── Ground ──────────────────────────────────────────────────────
const gridHelper = new THREE.GridHelper(0.6, 30, C.grid, C.grid);
gridHelper.material.opacity = 0.4;
gridHelper.material.transparent = true;
scene.add(gridHelper);

const groundGeo = new THREE.PlaneGeometry(2, 2);
const groundMat = new THREE.MeshStandardMaterial({ color: C.ground, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.001;
ground.receiveShadow = true;
scene.add(ground);

// ─── Helpers ─────────────────────────────────────────────────────
function makeMat(color) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.3 });
}
function cylinder(radius, height, color) {
  const geo = new THREE.CylinderGeometry(radius, radius, height, 16);
  const mesh = new THREE.Mesh(geo, makeMat(color));
  mesh.castShadow = true;
  return mesh;
}
function sphere(radius, color) {
  const geo = new THREE.SphereGeometry(radius, 16, 12);
  const mesh = new THREE.Mesh(geo, makeMat(color));
  mesh.castShadow = true;
  return mesh;
}
function box(w, h, d, color) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, makeMat(color));
  mesh.castShadow = true;
  return mesh;
}

// ─── Build arm ───────────────────────────────────────────────────
// Hierarchy: base → yawPivot → pitchPivot → upperArm → elbowPivot
//            → forearm → wristPitchPivot → wristLink → wristRollPivot → gripper

const armRoot = new THREE.Group();
scene.add(armRoot);

// Base platform
const baseMesh = cylinder(BASE_RADIUS, BASE_HEIGHT, C.base);
baseMesh.position.y = BASE_HEIGHT / 2;
armRoot.add(baseMesh);

// Shoulder yaw pivot (at top of base)
const yawPivot = new THREE.Group();
yawPivot.position.y = BASE_HEIGHT;
armRoot.add(yawPivot);

// Shoulder joint sphere
const shoulderJoint = sphere(JOINT_RADIUS, C.joint);
yawPivot.add(shoulderJoint);

// Shoulder pitch pivot
const pitchPivot = new THREE.Group();
yawPivot.add(pitchPivot);

// Upper arm — extends downward (-Y) from shoulder in local frame
// (pitch=0 means hanging down, pitch=pi means straight up)
const upperArmGroup = new THREE.Group();
pitchPivot.add(upperArmGroup);

const upperArmMesh = cylinder(LINK_RADIUS, UPPER_ARM_LEN, C.upper);
upperArmMesh.position.y = -UPPER_ARM_LEN / 2;
upperArmGroup.add(upperArmMesh);

// Elbow pivot (at end of upper arm)
const elbowPivot = new THREE.Group();
elbowPivot.position.y = -UPPER_ARM_LEN;
upperArmGroup.add(elbowPivot);

// Elbow joint sphere
const elbowJoint = sphere(JOINT_RADIUS * 0.85, C.joint);
elbowPivot.add(elbowJoint);

// Forearm — extends downward (-Y) from elbow
const forearmGroup = new THREE.Group();
elbowPivot.add(forearmGroup);

const forearmMesh = cylinder(LINK_RADIUS * 0.85, FOREARM_LEN, C.forearm);
forearmMesh.position.y = -FOREARM_LEN / 2;
forearmGroup.add(forearmMesh);

// Wrist pitch pivot (at end of forearm)
const wristPitchPivot = new THREE.Group();
wristPitchPivot.position.y = -FOREARM_LEN;
forearmGroup.add(wristPitchPivot);

// Wrist joint sphere
const wristJoint = sphere(JOINT_RADIUS * 0.7, C.joint);
wristPitchPivot.add(wristJoint);

// Wrist link — extends downward
const wristGroup = new THREE.Group();
wristPitchPivot.add(wristGroup);

const wristMesh = cylinder(LINK_RADIUS * 0.7, WRIST_LEN, C.wrist);
wristMesh.position.y = -WRIST_LEN / 2;
wristGroup.add(wristMesh);

// Wrist roll pivot (at end of wrist link)
const wristRollPivot = new THREE.Group();
wristRollPivot.position.y = -WRIST_LEN;
wristGroup.add(wristRollPivot);

// Gripper base
const gripperBase = box(0.03, 0.012, 0.018, C.joint);
gripperBase.position.y = -0.006;
wristRollPivot.add(gripperBase);

// Gripper fingers
const leftFinger = box(FINGER_W, FINGER_H, FINGER_D, C.finger);
leftFinger.position.set(-GRIP_MAX_HALF, -0.012 - FINGER_H / 2, 0);
wristRollPivot.add(leftFinger);

const rightFinger = box(FINGER_W, FINGER_H, FINGER_D, C.finger);
rightFinger.position.set(GRIP_MAX_HALF, -0.012 - FINGER_H / 2, 0);
wristRollPivot.add(rightFinger);

// ─── Angle state ─────────────────────────────────────────────────
const target = {
  shoulder_yaw: 0,
  shoulder_pitch: Math.PI / 2,  // arm horizontal forward
  elbow_pitch: 0,
  wrist_pitch: 0,
  wrist_roll: 0,
  gripper: 1.0,
};
const current = { ...target };
const tracking = { body: false, hand: false };

const LERP = 0.12;  // smoothing factor

function lerp(a, b, t) { return a + (b - a) * t; }

// ─── Angle conventions ──────────────────────────────────────────
// From iPhone JointAngleCalculator:
//   shoulder_yaw:   atan2(arm.x, arm.z) — horizontal rotation, 0 = forward (+Z)
//   shoulder_pitch: angle from DOWN (-Y). 0 = down, pi/2 = horizontal, pi = up
//   elbow_pitch:    pi - angleBetween(upper, fore). 0 = straight, pi = folded
//   wrist_pitch:    relative Euler X (wrist - elbow)
//   wrist_roll:     relative Euler Z (wrist - elbow)
//
// In Three.js the arm hangs along -Y in each local frame.
// Pitch rotations are around local X axis:
//   shoulder_pitch=0 → -Y (down), pi/2 → -Z (forward), pi → +Y (up)

function applyAngles() {
  // Smooth toward target
  current.shoulder_yaw   = lerp(current.shoulder_yaw,   target.shoulder_yaw,   LERP);
  current.shoulder_pitch = lerp(current.shoulder_pitch, target.shoulder_pitch, LERP);
  current.elbow_pitch    = lerp(current.elbow_pitch,    target.elbow_pitch,    LERP);
  current.wrist_pitch    = lerp(current.wrist_pitch,    target.wrist_pitch,    LERP);
  current.wrist_roll     = lerp(current.wrist_roll,     target.wrist_roll,     LERP);
  current.gripper        = lerp(current.gripper,         target.gripper,        LERP);

  // Shoulder yaw: rotate whole arm around Y
  yawPivot.rotation.y = current.shoulder_yaw;

  // Shoulder pitch: angle from down, rotating around X
  // pitch=0 → arm hangs down (-Y), pitch=pi/2 → forward, pitch=pi → up
  pitchPivot.rotation.x = current.shoulder_pitch;

  // Elbow: bends forearm relative to upper arm, around X
  // elbow=0 → straight (aligned), positive → bends toward "inside"
  elbowPivot.rotation.x = current.elbow_pitch;

  // Wrist pitch
  wristPitchPivot.rotation.x = current.wrist_pitch;

  // Wrist roll: rotation around the link axis (-Y → rotation.y)
  wristRollPivot.rotation.y = current.wrist_roll;

  // Gripper: 0 = closed, 1 = open
  const halfOpen = current.gripper * GRIP_MAX_HALF;
  const closedOffset = 0.004;  // fingers slightly apart when "closed"
  leftFinger.position.x  = -(closedOffset + halfOpen);
  rightFinger.position.x =  (closedOffset + halfOpen);
}

// ─── HUD update ──────────────────────────────────────────────────
const anglesDiv = document.getElementById('angles-display');
const angleNames = [
  ['Shoulder Yaw', 'shoulder_yaw'],
  ['Shoulder Pitch', 'shoulder_pitch'],
  ['Elbow', 'elbow_pitch'],
  ['Wrist Pitch', 'wrist_pitch'],
  ['Wrist Roll', 'wrist_roll'],
  ['Gripper', 'gripper'],
];
const fpsEl = document.getElementById('fps');
let frameCount = 0, lastFpsTime = performance.now(), currentFps = 0;

function updateHUD() {
  let html = '';
  for (const [label, key] of angleNames) {
    const val = current[key];
    const display = key === 'gripper'
      ? `${(val * 100).toFixed(0)}%`
      : `${(val * 180 / Math.PI).toFixed(1)}°`;
    html += `<div class="angle-row"><span class="angle-label">${label}</span><span class="angle-value">${display}</span></div>`;
  }
  anglesDiv.innerHTML = html;

  // Tracking badges
  const bodyEl = document.getElementById('track-body');
  const handEl = document.getElementById('track-hand');
  bodyEl.className = `tracking-badge ${tracking.body ? 'tracking-on' : 'tracking-off'}`;
  handEl.className = `tracking-badge ${tracking.hand ? 'tracking-on' : 'tracking-off'}`;

  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    currentFps = frameCount;
    frameCount = 0;
    lastFpsTime = now;
  }
  fpsEl.textContent = `${currentFps} fps`;
}

// ─── Animation loop ──────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  applyAngles();
  updateHUD();
  if (selectedJoint) updateArc();
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ─── Resize ──────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── WebSocket ───────────────────────────────────────────────────
const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
let ws = null;
let useSliders = false;
let messageCount = 0;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/viewer`);

  ws.onopen = () => {
    statusDot.className = 'status-dot viewing';
    statusText.textContent = 'Connected — waiting for phone';
  };

  ws.onmessage = (event) => {
    // Control echoes are handled regardless of slider mode.
    try {
      const ctrl = JSON.parse(event.data);
      if (ctrl.type === 'zero_captured') {
        const n = Object.keys(ctrl.ticks || {}).length;
        setTeachStatus(`zero captured (${n} joints): ${JSON.stringify(ctrl.ticks)}`);
        return;
      }
    } catch (e) { /* fall through */ }

    if (useSliders) return;  // ignore server stream when using test controls
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'arm_state' && data.angles) {
        target.shoulder_yaw   = data.angles.shoulder_yaw   ?? target.shoulder_yaw;
        target.shoulder_pitch = data.angles.shoulder_pitch ?? target.shoulder_pitch;
        target.elbow_pitch    = data.angles.elbow_pitch    ?? target.elbow_pitch;
        target.wrist_pitch    = data.angles.wrist_pitch    ?? target.wrist_pitch;
        target.wrist_roll     = data.angles.wrist_roll     ?? target.wrist_roll;
        target.gripper        = data.angles.gripper         ?? target.gripper;

        if (data.tracking) {
          tracking.body = !!data.tracking.body;
          tracking.hand = !!data.tracking.hand;
        }

        messageCount++;
        statusDot.className = 'status-dot connected';
        statusText.textContent = `Streaming (${messageCount} frames)`;
      }
    } catch (e) { /* ignore malformed */ }
  };

  ws.onclose = () => {
    statusDot.className = 'status-dot';
    statusText.textContent = 'Disconnected — reconnecting...';
    setTimeout(connect, 1500);
  };

  ws.onerror = () => ws.close();
}
connect();

// ─── Test controls (gripper slider only; the 5 rotary joints use arcs) ───────
const gripSlider = document.getElementById('s-grip');
const gripLabel  = document.getElementById('v-grip');

function readSliders() {
  if (!useSliders) return;
  target.gripper = parseFloat(gripSlider.value);
  gripLabel.textContent = (target.gripper * 100).toFixed(0) + '%';
}

// ─── Drive the REAL arm ──────────────────────────────────────────
// When armed, incremental slider drags are streamed to the server as
// arm_state messages (same format the iPhone sends) and the real servos
// follow. Default OFF — an explicit arm/fire gate. Preset buttons are
// deliberately NOT streamed: their large jumps could slam the arm.
let driveReal = false;
let lastSendTime = 0;
const SEND_INTERVAL_MS = 33;  // ~30 Hz, matches the controller write rate

function sendToArm(force = false) {
  if (!driveReal || !ws || ws.readyState !== WebSocket.OPEN) return;
  const now = performance.now();
  if (!force && now - lastSendTime < SEND_INTERVAL_MS) return;
  lastSendTime = now;
  ws.send(JSON.stringify({
    type: 'arm_state',
    timestamp: now / 1000,
    angles: {
      shoulder_yaw:   target.shoulder_yaw,
      shoulder_pitch: target.shoulder_pitch,
      elbow_pitch:    target.elbow_pitch,
      wrist_pitch:    target.wrist_pitch,
      wrist_roll:     target.wrist_roll,
      gripper:        target.gripper,
    },
    // body drives the arm joints, hand drives the gripper — both on so the
    // full pose is applied. The first frame locks the controller's reference
    // pose, so "current virtual pose" maps to "current real home".
    tracking: { body: true, hand: true },
  }));
}

// Control messages (torque, capture-zero) — sent regardless of drive state.
function sendControl(obj) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    setTeachStatus('not connected');
    return;
  }
  ws.send(JSON.stringify(obj));
}
function setTeachStatus(msg) {
  document.getElementById('teach-status').textContent = msg;
}
window.setTorque = (on) => {
  sendControl({ type: 'set_torque', on });
  setTeachStatus(on ? 'holding (rigid)' : 'limp — pose by hand');
};
window.captureZero = () => {
  sendControl({ type: 'capture_zero' });
  setTeachStatus('capturing…');
};

window.toggleDrive = () => {
  driveReal = !driveReal;
  const btn = document.getElementById('drive-btn');
  btn.textContent = `⚡ Drive Real Arm: ${driveReal ? 'ON' : 'OFF'}`;
  btn.classList.toggle('driving', driveReal);
  document.body.classList.toggle('driving-real', driveReal);
  if (driveReal) {
    // Own the target: switch to slider mode so the inbound stream can't fight us.
    if (!useSliders) toggleControls();
    syncSlidersFromTarget();
    sendToArm(true);  // lock the reference at the current pose
  }
};

gripSlider.addEventListener('input', () => { readSliders(); sendToArm(); });

function syncSlidersFromTarget() {
  gripSlider.value = target.gripper;
  gripLabel.textContent = (target.gripper * 100).toFixed(0) + '%';
}

// ─── Interactive joint arcs ──────────────────────────────────────
// Select a joint → a semicircular arc appears at its pivot, spanning its range
// of motion. Each dot along the arc is a candidate angle, colored GREEN if that
// angle is self-collision-free (with the other joints held) or RED if the arm
// would hit itself there (collidesJS, the drift-guarded port). Drag the white
// handle along the arc to set the angle. Replaces the abstract sliders with a
// spatial control that shows the safe envelope directly.
const ARC_R = 0.06;         // arc radius in meters
const ARC_DOTS = 44;        // samples along the range
const COL_SAFE = 0x35d17a;
const COL_UNSAFE = 0xff4444;
const AXIS_VEC = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0) };

// Per-joint: the static parent frame the arc lives in, the pivot center in that
// frame, the rotation axis, the local direction the child points at angle 0, and
// the travel range. Centers/dims reuse the viewer's own link constants.
const JOINT_ARCS = {
  shoulder_yaw:   { label: 'Shoulder Yaw',   mount: armRoot,       center: [0, BASE_HEIGHT, 0],       axis: 'y', ref: [0, 0, -1], min: -Math.PI, max: Math.PI },
  shoulder_pitch: { label: 'Shoulder Pitch', mount: yawPivot,      center: [0, 0, 0],                 axis: 'x', ref: [0, -1, 0], min: 0,        max: Math.PI },
  elbow_pitch:    { label: 'Elbow',          mount: upperArmGroup, center: [0, -UPPER_ARM_LEN, 0],    axis: 'x', ref: [0, -1, 0], min: 0,        max: Math.PI },
  wrist_pitch:    { label: 'Wrist Pitch',    mount: forearmGroup,  center: [0, -FOREARM_LEN, 0],      axis: 'x', ref: [0, -1, 0], min: -2,       max: 2 },
  wrist_roll:     { label: 'Wrist Roll',     mount: wristGroup,    center: [0, -WRIST_LEN, 0],        axis: 'y', ref: [1, 0, 0],  min: -Math.PI, max: Math.PI },
};

let selectedJoint = null;
let arcGroup = null;
let arcDots = [];
let arcHandle = null;
const raycaster = new THREE.Raycaster();
let dragging = false;
const arcStatus = document.getElementById('arc-status');

function jointDir(spec, theta) {
  return new THREE.Vector3(spec.ref[0], spec.ref[1], spec.ref[2])
    .applyAxisAngle(AXIS_VEC[spec.axis], theta);
}

function clearArc() {
  if (arcGroup && arcGroup.parent) arcGroup.parent.remove(arcGroup);
  arcGroup = null; arcDots = []; arcHandle = null;
}

function buildArc(joint) {
  clearArc();
  const spec = JOINT_ARCS[joint];
  arcGroup = new THREE.Group();
  spec.mount.add(arcGroup);
  const dotGeo = new THREE.SphereGeometry(0.0035, 8, 6);
  for (let i = 0; i < ARC_DOTS; i++) {
    const m = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: COL_SAFE }));
    arcGroup.add(m); arcDots.push(m);
  }
  arcHandle = new THREE.Mesh(new THREE.SphereGeometry(0.009, 14, 12),
                            new THREE.MeshBasicMaterial({ color: 0xffffff }));
  arcGroup.add(arcHandle);
  selectedJoint = joint;
  updateArc();
}

function updateArc() {
  const spec = JOINT_ARCS[selectedJoint];
  if (!spec || !arcGroup) return;
  const center = new THREE.Vector3(spec.center[0], spec.center[1], spec.center[2]);
  for (let i = 0; i < ARC_DOTS; i++) {
    const theta = spec.min + (spec.max - spec.min) * (i / (ARC_DOTS - 1));
    arcDots[i].position.copy(center).addScaledVector(jointDir(spec, theta), ARC_R);
    const pose = { ...target, [selectedJoint]: theta };
    arcDots[i].material.color.setHex(collidesJS(pose).hit ? COL_UNSAFE : COL_SAFE);
  }
  const cur = target[selectedJoint];
  arcHandle.position.copy(center).addScaledVector(jointDir(spec, cur), ARC_R);
  const curHit = collidesJS(target).hit;
  arcHandle.material.color.setHex(curHit ? 0xff9090 : 0xffffff);
  arcStatus.textContent =
    `${spec.label}: ${(cur * 180 / Math.PI).toFixed(0)}°  ${curHit ? '⚠ self-collision' : '✓ safe'}`;
  arcStatus.style.color = curHit ? '#ff8080' : '#8fe0b0';
}

// Map a pointer event onto the selected arc's plane → (signed angle, radius).
function arcHit(e, spec) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  spec.mount.updateWorldMatrix(true, false);
  const wc = new THREE.Vector3(spec.center[0], spec.center[1], spec.center[2])
    .applyMatrix4(spec.mount.matrixWorld);
  const q = new THREE.Quaternion(); spec.mount.getWorldQuaternion(q);
  const axis = AXIS_VEC[spec.axis].clone().applyQuaternion(q).normalize();
  const ref = new THREE.Vector3(spec.ref[0], spec.ref[1], spec.ref[2])
    .applyQuaternion(q).normalize();
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(axis, wc);
  const hit = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(plane, hit)) return null;
  const v = hit.sub(wc);
  const dist = v.length();
  const proj = v.clone().addScaledVector(axis, -v.dot(axis));
  if (proj.lengthSq() < 1e-9) return { ang: 0, dist };
  proj.normalize();
  const ang = Math.atan2(new THREE.Vector3().crossVectors(ref, proj).dot(axis), ref.dot(proj));
  return { ang, dist };
}

function setArcAngle(spec, ang) {
  target[selectedJoint] = Math.max(spec.min, Math.min(spec.max, ang));
  sendToArm();
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (!selectedJoint) return;
  const spec = JOINT_ARCS[selectedJoint];
  const r = arcHit(e, spec);
  if (r && Math.abs(r.dist - ARC_R) < 0.03) {   // grabbed near the arc track
    dragging = true; controls.enabled = false;
    setArcAngle(spec, r.ang);
    e.preventDefault();
  }
});
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const r = arcHit(e, JOINT_ARCS[selectedJoint]);
  if (r) setArcAngle(JOINT_ARCS[selectedJoint], r.ang);
});
window.addEventListener('pointerup', () => {
  if (dragging) { dragging = false; controls.enabled = true; }
});

function selectJoint(joint) {
  document.querySelectorAll('.jbtn').forEach((b) =>
    b.classList.toggle('selected', b.dataset.joint === joint));
  if (!useSliders) toggleControls();   // local control owns target
  buildArc(joint);
}
function deselectJoint() {
  document.querySelectorAll('.jbtn').forEach((b) => b.classList.remove('selected'));
  clearArc(); selectedJoint = null; arcStatus.textContent = '';
}
document.querySelectorAll('.jbtn').forEach((btn) => {
  btn.addEventListener('click', () =>
    selectedJoint === btn.dataset.joint ? deselectJoint() : selectJoint(btn.dataset.joint));
});

// Preset poses
window.setHome = () => {
  target.shoulder_yaw = 0;
  target.shoulder_pitch = Math.PI;       // straight up
  target.elbow_pitch = 0;
  target.wrist_pitch = 0;
  target.wrist_roll = 0;
  target.gripper = 1;
  syncSlidersFromTarget();
};
window.setForward = () => {
  target.shoulder_yaw = 0;
  target.shoulder_pitch = Math.PI / 2;   // horizontal forward
  target.elbow_pitch = 0;
  target.wrist_pitch = 0;
  target.wrist_roll = 0;
  target.gripper = 1;
  syncSlidersFromTarget();
};
window.setRelaxed = () => {
  target.shoulder_yaw = 0;
  target.shoulder_pitch = Math.PI * 0.4; // slightly forward of down
  target.elbow_pitch = Math.PI / 3;      // elbow bent
  target.wrist_pitch = 0;
  target.wrist_roll = 0;
  target.gripper = 0.6;
  syncSlidersFromTarget();
};

// Toggle controls panel
window.toggleControls = () => {
  const panel = document.getElementById('controls');
  const btn = document.getElementById('controls-toggle');
  const isOpen = panel.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  btn.textContent = isOpen ? 'Hide Controls' : 'Test Controls';
  useSliders = isOpen;
  if (isOpen) syncSlidersFromTarget();
  else deselectJoint();
};

// Start with arm in a natural pose
target.shoulder_pitch = Math.PI / 2;
target.elbow_pitch = 0;
target.gripper = 1.0;

</script>
</body>
